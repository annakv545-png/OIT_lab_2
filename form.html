  <form class="modal-form">
      <div class="form-field">
         <label for="user-name" class="field-label">Name</label>
        <div class="input-wrapper">
            <input type="text" name="user-name" id="user-name" class="form-input" required/>
            <svg class="input-icon" width="18" height="24">
              <use href="./images/icons.svg#icon-person"></use>
            </svg>
          </div>
      </div>
        <div class="form-field">
        <label for="user-phone" class="field-label">Phone</label>
        <div class="input-wrapper">
          <input type="tel" name="user-phone" id="user-phone" class="form-input" required />
          <svg class="input-icon" width="18" height="24">
              <use href="./images/icons.svg#icon-phone"></use>
            </svg>
        </div>
      </div>
      <div class="form-field">
        <label for="user-email" class="field-label">Email</label>
        <div class="input-wrapper">
          <input type="email" name="user-email" id="user-email" class="form-input" required />
           <svg class="input-icon" width="18" height="24">
              <use href="./images/icons.svg#icon-email"></use>
            </svg>
        </div>
      </div>
      <div class="form-label comment-field">
        <label for="user-comment" class="field-label">Comment</label>
        <textarea 
        name="user-comment" 
        class="form-textarea"
        id="user-comment" 
        placeholder="Text input"></textarea>
      </div>
      <div class="checkbox-wrapper">
        <input type="checkbox" name="user-privacy" id="privacy-checkbox" class="visually-hidden" value="true" required />
        <label for="privacy-checkbox" class="checkbox-label">
          <span class="custom-checkbox">
            <svg class="checkbox-icon" width="10" height="8">
              <use href="./images/icons.svg#icon-check-mark"></use>
            </svg>
          </span>
          I accept the terms and conditions of the <a href="#" class="privacy-link">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="submit-btn">Send</button>
    </form>
